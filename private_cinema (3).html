<script>

// ========================================================

// 🗄️ IndexedDB 工具（完全不变）

// ========================================================

const DB_NAME = 'PrivateCinemaDB';

const DB_VERSION = 2;

const STORE_NAME = 'movies';

let db = null;



function openDB() {

return new Promise((resolve, reject) => {

const request = indexedDB.open(DB_NAME, DB_VERSION);

request.onupgradeneeded = (e) => {

const d = e.target.result;

if (!d.objectStoreNames.contains(STORE_NAME)) {

const store = d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });

store.createIndex('name', 'name', { unique: false });

store.createIndex('uploadTime', 'uploadTime', { unique: false });

}

};

request.onsuccess = (e) => resolve(e.target.result);

request.onerror = (e) => reject(e.target.error);

});

}

async function getDB() { if (!db) db = await openDB(); return db; }

async function addMovie(movie) {

const database = await getDB();

return new Promise((resolve, reject) => {

const tx = database.transaction(STORE_NAME, 'readwrite');

const store = tx.objectStore(STORE_NAME);

const req = store.add(movie);

req.onsuccess = () => resolve(req.result);

req.onerror = () => reject(req.error);

});

}

async function getAllMovies() {

const database = await getDB();

return new Promise((resolve, reject) => {

const tx = database.transaction(STORE_NAME, 'readonly');

const store = tx.objectStore(STORE_NAME);

const req = store.getAll();

req.onsuccess = () => resolve(req.result);

req.onerror = () => reject(req.error);

});

}

async function deleteMovie(id) {

const database = await getDB();

return new Promise((resolve, reject) => {

const tx = database.transaction(STORE_NAME, 'readwrite');

const store = tx.objectStore(STORE_NAME);

const req = store.delete(id);

req.onsuccess = () => resolve();

req.onerror = () => reject(req.error);

});

}

async function getMovie(id) {

const database = await getDB();

return new Promise((resolve, reject) => {

const tx = database.transaction(STORE_NAME, 'readonly');

const store = tx.objectStore(STORE_NAME);

const req = store.get(id);

req.onsuccess = () => resolve(req.result);

req.onerror = () => reject(req.error);

});

}

function formatFileSize(bytes) {

if (bytes < 1024) return bytes + ' B';

if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';

if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';

return (bytes / 1073741824).toFixed(1) + ' GB';

}

function getFileExtension(filename) { return filename.split('.').pop().toLowerCase(); }

function getVideoMimeType(filename) {

const ext = getFileExtension(filename);

const map = { 'mp4':'video/mp4', 'webm':'video/webm', 'ogg':'video/ogg', 'mov':'video/quicktime', 'avi':'video/x-msvideo', 'mkv':'video/x-matroska', 'flv':'video/x-flv', 'wmv':'video/x-ms-wmv', 'm4v':'video/mp4', 'mpg':'video/mpeg', 'mpeg':'video/mpeg' };

return map[ext] || 'video/mp4';

}

function showToast(message, type = 'info') {

const container = document.getElementById('toastContainer');

const toast = document.createElement('div');

toast.className = `toast ${type}`;

const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';

toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;

container.appendChild(toast);

setTimeout(() => {

toast.style.opacity = '0';

toast.style.transform = 'translateX(30px)';

toast.style.transition = 'all 0.4s ease';

setTimeout(() => toast.remove(), 400);

}, 3500);

}

emptyStateEl.style.display = 'block';

movieCountEl.textContent = '0';

usedSpaceEl.textContent = '0 MB';

return;

}

emptyStateEl.style.display = 'none';

let totalSize = 0;

let html = '<div class="movie-grid">';

for (const m of movies) {

totalSize += m.fileSize || 0;

const sizeStr = formatFileSize(m.fileSize || 0);

html += `

<div class="movie-card" data-id="${m.id}">

<div class="thumbnail">

🎬

<div class="play-icon">▶</div>

<div class="lock-badge">🔒 密码保护</div>

</div>

<div class="info">

<div class="name" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}</div>

<div class="meta">

<span class="size">${sizeStr}</span>

<span>${new Date(m.uploadTime).toLocaleDateString()}</span>

</div>

</div>

<div class="card-actions">

<button class="btn-icon" data-action="delete" data-id="${m.id}" title="删除">🗑️</button>

</div>

</div>

`;

}

html += '</div>';

movieListEl.innerHTML = html;

movieCountEl.textContent = movies.length;

usedSpaceEl.textContent = formatFileSize(totalSize);



document.querySelectorAll('.movie-card').forEach(card => {

card.addEventListener('click', (e) => {

if (e.target.closest('[data-action="delete"]')) return;

const id = parseInt(card.dataset.id);

openPasswordModal(id);

});

});

document.querySelectorAll('[data-action="delete"]').forEach(btn => {

btn.addEventListener('click', async (e) => {

e.stopPropagation();

const id = parseInt(btn.dataset.id);

if (confirm('确定要删除这部电影吗？')) {

await deleteMovie(id);

showToast('已删除电影', 'success');

await loadMovies();

}

});

});

}



async function loadMovies() {

try {

movies = await getAllMovies();

movies.sort((a, b) => b.uploadTime - a.uploadTime);

renderMovies();

} catch (err) {

console.error('加载失败:', err);

showToast('加载数据失败，请刷新重试', 'error');

}

}



// ----- iOS 修复 + 上传 -----

const fileDropArea = document.getElementById('fileDropArea');

fileDropArea.addEventListener('click', function(e) { e.preventDefault(); fileInput.click(); });

fileInput.addEventListener('change', (e) => {

const file = e.target.files[0];

if (file) { fileNameDisplay.textContent = `📁 ${file.name} (${formatFileSize(file.size)})`; }

else { fileNameDisplay.textContent = ''; }

});

fileDropArea.addEventListener('dragover', (e) => { e.preventDefault(); fileDropArea.style.borderColor = '#f7971e'; fileDropArea.style.background = '#1a1e2a'; });

fileDropArea.addEventListener('dragleave', () => { fileDropArea.style.borderColor = '#2a2f3a'; fileDropArea.style.background = '#0f141c'; });

fileDropArea.addEventListener('drop', (e) => {

e.preventDefault();

fileDropArea.style.borderColor = '#2a2f3a';

fileDropArea.style.background = '#0f141c';

const files = e.dataTransfer.files;

if (files.length > 0) {

const file = files[0];

if (file.type.startsWith('video/')) {

fileInput.files = files;

fileNameDisplay.textContent = `📁 ${file.name} (${formatFileSize(file.size)})`;

} else {

showToast('请上传视频文件', 'error');

}

}

});



uploadForm.addEventListener('submit', async (e) => {

e.preventDefault();

const adminPwd = prompt('🔑 请输入管理员密码才能上传：');

if (adminPwd !== 'admin123') {

showToast('❌ 密码错误，无权上传', 'error');

return;

}

const name = movieNameInput.value.trim();

const password = moviePasswordInput.value.trim();

const file = fileInput.files[0];

if (!name) { showToast('请输入电影名称', 'error'); movieNameInput.focus(); return; }

if (!password) { showToast('请设置观看密码', 'error'); moviePasswordInput.focus(); return; }

if (!file) { showToast('请选择视频文件', 'error'); return; }

if (!file.type.startsWith('video/')) { showToast('请上传有效的视频文件', 'error'); return; }

if (file.size > 2 * 1024 * 1024 * 1024) { showToast('文件过大，请上传小于 2GB 的视频', 'error'); return; }

try {

submitUploadBtn.disabled = true;

submitUploadBtn.textContent = '⏳ 上传中...';

const reader = new FileReader();

const fileData = await new Promise((resolve, reject) => {

reader.onload = () => resolve(reader.result);

reader.onerror = () => reject(reader.error);

reader.readAsArrayBuffer(file);

});

const movie = {

name, password, fileName: file.name,

fileType: file.type || getVideoMimeType(file.name),

fileData, fileSize: file.size,

uploadTime: Date.now()

};

await addMovie(movie);

showToast(`🎉 《${name}》上传成功！`, 'success');

uploadForm.reset();

fileNameDisplay.textContent = '';

uploadPanel.classList.remove('open');

toggleUploadBtn.textContent = '📤 上传电影';

await loadMovies();

} catch (err) {

console.error('上传失败:', err);

showToast('上传失败，请重试', 'error');

} finally {

submitUploadBtn.disabled = false;

submitUploadBtn.textContent = '✅ 确认上传';

}

});



// ----- 密码模态框 -----

let pendingMovieId = null;

function openPasswordModal(movieId) {

const movie = movies.find(m => m.id === movieId);

if (!movie) { showToast('电影不存在', 'error'); return; }

pendingMovieId = movieId;

passwordMovieName.textContent = movie.name;

passwordInput.value = '';

passwordError.textContent = '';

passwordModal.classList.add('open');

setTimeout(() => passwordInput.focus(), 200);

}

function closePasswordModal() {

passwordModal.classList.remove('open');

pendingMovieId = null;

passwordInput.value = '';

passwordError.textContent = '';

}

passwordCancelBtn.addEventListener('click', closePasswordModal);

passwordModalClose.addEventListener('click', closePasswordModal);

passwordModal.addEventListener('click', (e) => { if (e.target === passwordModal) closePasswordModal(); });

passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); passwordConfirmBtn.click(); } });

passwordConfirmBtn.addEventListener('click', async () => {

const movieId = pendingMovieId;

if (!movieId) { closePasswordModal(); return; }

const movie = movies.find(m => m.id === movieId);

if (!movie) { showToast('电影数据已丢失', 'error'); closePasswordModal(); return; }

const inputPwd = passwordInput.value.trim();

if (inputPwd !== movie.password) {

passwordError.textContent = '❌ 密码错误，请重试';

passwordInput.value = '';

passwordInput.focus();

return;

}

closePasswordModal();

await playMovie(movieId);

});



// ----- 播放器 -----

async function playMovie(movieId) {

try {

const movie = await getMovie(movieId);

if (!movie) { showToast('电影数据已丢失', 'error'); return; }

const blob = new Blob([movie.fileData], { type: movie.fileType || 'video/mp4' });

const url = URL.createObjectURL(blob);

playerTitle.textContent = `🎬 ${movie.name}`;

playerVideo.src = url;

playerVideo.load();

playerModal.classList.add('open');

playerVideo.play().catch(() => {});

playerVideo.onended = () => { URL.revokeObjectURL(url); };

} catch (err) {

console.error('播放失败:', err);

showToast('播放失败，请重试', 'error');

}

}

function closePlayer() {

playerModal.classList.remove('open');

if (playerVideo.src) {

URL.revokeObjectURL(playerVideo.src);

playerVideo.pause();

playerVideo.src = '';

playerVideo.load();

}

}

playerCloseBtn.addEventListener('click', closePlayer);

playerModalClose.addEventListener('click', closePlayer);

playerModal.addEventListener('click', (e) => { if (e.target === playerModal) closePlayer(); });

document.addEventListener('keydown', (e) => {

if (e.key === 'Escape') {

if (playerModal.classList.contains('open')) closePlayer();

if (passwordModal.classList.contains('open')) closePasswordModal();

}

});



// ----- UI 控制 -----

toggleUploadBtn.addEventListener('click', () => {

const isOpen = uploadPanel.classList.toggle('open');

toggleUploadBtn.textContent = isOpen ? '✕ 关闭上传' : '📤 上传电影';

if (isOpen) movieNameInput.focus();

});

cancelUploadBtn.addEventListener('click', () => {

uploadForm.reset();

fileNameDisplay.textContent = '';

uploadPanel.classList.remove('open');

toggleUploadBtn.textContent = '📤 上传电影';

});

emptyUploadBtn.addEventListener('click', () => {

uploadPanel.classList.add('open');

toggleUploadBtn.textContent = '✕ 关闭上传';

movieNameInput.focus();

});

refreshBtn.addEventListener('click', async () => {

refreshBtn.textContent = '⏳ 刷新中...';

refreshBtn.disabled = true;

await loadMovies();

refreshBtn.textContent = '🔄 刷新';

refreshBtn.disabled = false;

showToast('已刷新', 'success');

});



// ----- 初始化 -----

(async function init() {

try {

await loadMovies();

showToast('🎬 私人影院已就绪', 'success');

} catch (err) {

console.error('初始化失败:', err);

showToast('初始化失败，请刷新页面', 'error');

}

})();

window.addEventListener('beforeunload', () => {

if (playerVideo.src) URL.revokeObjectURL(playerVideo.src);

});

console.log('🎬 私人影院已启动！');

console.log('📌 所有数据存储在 IndexedDB 中，请勿清除浏览器数据。');

</script>
